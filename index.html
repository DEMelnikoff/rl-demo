<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Two-Step RL Task — MF, MB &amp; SR</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
</head>
<body>

<div class="app-wrapper">

  <!-- ── Header ──────────────────────────────────────────────────────────────── -->
  <header class="site-header">
    <div class="header-left">
      <h1>Two-Step RL Task Explorer</h1>
      <p class="subtitle">Model-Free · Model-Based · Successor Representation</p>
    </div>
    <div class="phase-tabs" id="phase-tabs">
      <button class="phase-tab phase-choice active" data-phase="choice">Choice Phase</button>
      <button class="phase-tab phase-transition" data-phase="transition_reval">Transition Revaluation</button>
      <button class="phase-tab phase-outcome" data-phase="outcome_reval">Outcome Revaluation</button>
      <button class="settings-btn" id="open-settings-btn" title="Settings">⚙ Settings</button>
    </div>
  </header>

  <!-- ── Settings Overlay ─────────────────────────────────────────────────────── -->
  <div id="settings-overlay" class="settings-overlay" style="display:none">
    <div class="settings-panel">
      <div class="settings-header">
        <h2>Settings</h2>
        <button class="btn" id="close-settings-btn">← Back</button>
      </div>
      <p class="settings-help">Changes apply immediately. Reset the simulation to clear learned values.</p>

      <div class="settings-group">
        <h3>Learning rates</h3>
        <div class="settings-row">
          <label for="param-alpha-mf">α (Model-Free)</label>
          <input type="range" id="param-alpha-mf" min="0" max="1" step="0.05"/>
          <span class="settings-val" id="param-alpha-mf-val">0.30</span>
        </div>
        <div class="settings-row">
          <label for="param-alpha-mb">α (Model-Based)</label>
          <input type="range" id="param-alpha-mb" min="0" max="1" step="0.05"/>
          <span class="settings-val" id="param-alpha-mb-val">0.50</span>
        </div>
        <div class="settings-row">
          <label for="param-alpha-sr">α (Successor Rep.)</label>
          <input type="range" id="param-alpha-sr" min="0" max="1" step="0.05"/>
          <span class="settings-val" id="param-alpha-sr-val">0.30</span>
        </div>
      </div>

      <div class="settings-group">
        <h3>Policy</h3>
        <div class="settings-row">
          <label for="param-beta">β (softmax inverse temperature)</label>
          <input type="range" id="param-beta" min="0" max="20" step="0.5"/>
          <span class="settings-val" id="param-beta-val">5.0</span>
        </div>
        <div class="settings-row">
          <label for="param-gamma">γ (discount factor)</label>
          <input type="range" id="param-gamma" min="0" max="1" step="0.05"/>
          <span class="settings-val" id="param-gamma-val">1.00</span>
        </div>
      </div>

      <div class="settings-footer">
        <button class="btn" id="reset-params-btn">↺ Restore defaults</button>
      </div>
    </div>
  </div>

  <!-- ── Done Banner ──────────────────────────────────────────────────────────── -->
  <div id="done-banner"></div>

  <!-- ── Full-width Task Diagram ──────────────────────────────────────────────── -->
  <div class="card task-card">
    <div class="card-title">Task Structure</div>
    <div id="task-diagram"></div>
  </div>

  <!-- ── Controls & Phase Bar ─────────────────────────────────────────────────── -->
  <div class="card controls-card">
    <div class="controls-row">
      <div class="controls">
        <button class="btn btn-primary" id="play-btn">▶ Play</button>
        <button class="btn" id="next-btn">→ Next Step</button>
        <button class="btn btn-danger" id="reset-btn">↺ Reset</button>
        <div class="speed-control">
          <label for="speed-slider">Speed:</label>
          <input type="range" id="speed-slider" min="1" max="4" value="2" step="1"/>
          <span id="speed-label">Medium</span>
        </div>
      </div>
      <div class="phase-section">
        <div id="trial-count">Trial 0</div>
      </div>
    </div>
  </div>
  <div id="phase-indicator" style="display:none"></div>
  <div id="trial-progress" style="display:none"></div>

  <!-- ── Bottom 2-column: Algorithm Panel | Q Chart ───────────────────────────── -->
  <div class="bottom-grid">

    <div class="card algo-card">
      <div class="algo-toggle" id="algo-toggle">
        <button class="algo-toggle-btn active" data-algo="mf">Model-Free</button>
        <button class="algo-toggle-btn" data-algo="mb">Model-Based</button>
        <button class="algo-toggle-btn" data-algo="sr">Successor Representation</button>
      </div>
      <div id="algo-panel"></div>
    </div>

    <div class="card chart-card">
      <div class="card-title">Q(🚀) over time</div>
      <div id="q-chart"></div>
      <div class="chart-legend">
        <span style="color:#F59E0B">─── MF</span>
        <span style="color:#3B82F6">─── MB</span>
        <span style="color:#10B981">─── SR</span>
      </div>
    </div>

  </div>

  <!-- Hidden step log container (kept for code compatibility but not rendered visibly) -->
  <div id="step-log" style="display:none"></div>

</div><!-- end .app-wrapper -->

<script type="module" src="js/main.js"></script>
</body>
</html>
